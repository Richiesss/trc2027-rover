# 自律ミッションのミッションファイルの例（競技説明編 表A-2 の対応表の例の座標を使っている）
#
#   ros2 launch trc_bringup navigation.launch.py mission:=<このファイル>
#
# 当日の使い方：
#   1. 運営から配られる対応表（csv）を markers_csv に指定する（このファイルからの相対パスでもよい）
#   2. 座標が分かる 1 組のチェックポイントは、ID で書く
#   3. 座標が分からないマーカーは、探して推定した座標を a / b に直接書く（エントリー部門は人が設定してよい）
#   4. 回る順番どおりに route に並べる
#
# チェックポイント = 2 本の ArUco マーカーを結んだ線分。線分の中点を垂直に横切り、
# 機体全体が跨ぎ切れる所（奥の点）まで進む。
markers_csv: example_markers.csv
route:
  - checkpoint: [0, 1]            # 対応表の ID 0 と ID 1 を結ぶ線分
    name: CP1
  - checkpoint:                   # 対応表にないマーカー：推定した座標を書く
      a: [35.536850, 134.210700]
      b: [35.536830, 134.210750]
    name: CP2
  - latlon: [35.536784, 134.210739]
    name: 最後の地点
